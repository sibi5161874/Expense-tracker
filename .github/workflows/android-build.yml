name: Android APK Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo Prebuild (Generate Android native project)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://wkfyfslgfpcybyajjndl.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrZnlmc2xnZnBjeWJ5YWpqbmRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2OTQ1NzEsImV4cCI6MjA5OTI3MDU3MX0.grButg-0T-WfoPVwYDqxzaGejz_pmb2nzDk6fdj6Q4s' }}
          EXPO_PUBLIC_WEB_APP_URL: ${{ secrets.EXPO_PUBLIC_WEB_APP_URL || 'https://web-six-beta-34.vercel.app' }}

      - name: Prepare Signing Keystore
        id: keystore
        run: |
          mkdir -p apps/mobile/android/app
          KEYSTORE_FILE="$GITHUB_WORKSPACE/apps/mobile/android/app/release.keystore"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom KEYSTORE_BASE64 from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
            echo "STORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No custom keystore found in secrets. Auto-generating CI release signing keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias kashmap-release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "kashmap_ci_pass_123" \
              -keypass "kashmap_ci_pass_123" \
              -dname "CN=KashMap, OU=Mobile, O=KashMap, L=SanFrancisco, S=CA, C=US"
            echo "STORE_PASS=kashmap_ci_pass_123" >> $GITHUB_ENV
            echo "KEY_ALIAS=kashmap-release" >> $GITHUB_ENV
            echo "KEY_PASS=kashmap_ci_pass_123" >> $GITHUB_ENV
          fi

      - name: Configure Gradle Wrapper permissions
        run: chmod +x apps/mobile/android/gradlew

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        working-directory: apps/mobile/android
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/apps/mobile/android/app/release.keystore"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"

          if [ "$BUILD_TYPE" = "release" ]; then
            echo "Assembling signed Release APK..."
            ./gradlew assembleRelease --no-daemon \
              -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m" \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS" \
              -Pandroid.injected.signing.v1-signing-enabled=true \
              -Pandroid.injected.signing.v2-signing-enabled=true
          else
            echo "Assembling Debug APK..."
            ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"
          fi
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://wkfyfslgfpcybyajjndl.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrZnlmc2xnZnBjeWJ5YWpqbmRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2OTQ1NzEsImV4cCI6MjA5OTI3MDU3MX0.grButg-0T-WfoPVwYDqxzaGejz_pmb2nzDk6fdj6Q4s' }}
          EXPO_PUBLIC_WEB_APP_URL: ${{ secrets.EXPO_PUBLIC_WEB_APP_URL || 'https://web-six-beta-34.vercel.app' }}

      - name: Determine Release Metadata & Prepare APK
        id: release_meta
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          APK_RAW=$(find apps/mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)

          if [ -z "$APK_RAW" ]; then
            echo "::error::No APK file generated!"
            exit 1
          fi

          DIST_DIR="apps/mobile/android/app/build/outputs/dist"
          mkdir -p "$DIST_DIR"
          OUTPUT_APK="$DIST_DIR/KashMap-v${VERSION}.apk"
          cp "$APK_RAW" "$OUTPUT_APK"

          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="Release $TAG_NAME"
            PRERELEASE=false
          else
            TAG_NAME="latest"
            RELEASE_NAME="KashMap Latest Build (v$VERSION)"
            PRERELEASE=true
          fi

          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Prepared APK at: $OUTPUT_APK for release: $TAG_NAME"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KashMap-v${{ steps.release_meta.outputs.version }}-${{ github.sha }}
          path: ${{ steps.release_meta.outputs.apk_path }}
          retention-days: 14

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.release_meta.outputs.apk_path }}
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
