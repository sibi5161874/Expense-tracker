name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only — Next.js needs these defined to compile the
      # Supabase client modules, but no network call happens during `next build`.
      # Real values live in each environment's own secrets, never here.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Non-blocking: pnpm audit has no per-workspace scoping, so this always includes
        # apps/mobile's Expo/Metro dev-toolchain transitive tree, which currently carries
        # unresolved high-severity advisories (metro/image-size etc) with no non-major fix
        # available — see RULES.md §17. Failing the build on those isn't actionable without
        # a risky, untested Expo major bump, so this step surfaces new findings in the CI
        # log without blocking merges on pre-existing, tracked ones.
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  verify-rls:
    # Runs the RLS cross-user isolation smoke test (apps/web/scripts/verify-rls.mjs)
    # against a dedicated TEST Supabase project — never point these secrets at prod,
    # since the script creates and deletes real auth users and inserts/deletes real
    # rows. Skipped entirely when the secrets aren't configured (e.g. fork PRs, or
    # before a test project is wired up) rather than failing CI on missing secrets.
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.RLS_TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.RLS_TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RLS_TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check RLS test project secrets are configured
        id: secrets-check
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping RLS verification — RLS_TEST_SUPABASE_* secrets are not set. See RULES.md §10."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.secrets-check.outputs.configured == 'true'
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        if: steps.secrets-check.outputs.configured == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets-check.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify RLS isolation
        if: steps.secrets-check.outputs.configured == 'true'
        working-directory: apps/web
        run: node scripts/verify-rls.mjs

  verify-payment-reservation:
    # Runs the reserve_payment_order concurrency check (apps/web/scripts/verify-payment-reservation.mjs)
    # against the same dedicated TEST Supabase project as verify-rls — same secrets, same
    # skip-if-unconfigured pattern, since this also creates a real auth user and payment_events
    # rows. Requires the payment_order_reservation migration to be applied to that test
    # project (same as production) — until then this job will fail with "function
    # reserve_payment_order does not exist", which is the correct signal that the migration
    # hasn't been pushed yet, not a flaky test.
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.RLS_TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.RLS_TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RLS_TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check test project secrets are configured
        id: secrets-check
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping payment-reservation verification — RLS_TEST_SUPABASE_* secrets are not set."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.secrets-check.outputs.configured == 'true'
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        if: steps.secrets-check.outputs.configured == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets-check.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify payment reservation concurrency
        if: steps.secrets-check.outputs.configured == 'true'
        working-directory: apps/web
        run: node scripts/verify-payment-reservation.mjs

  e2e:
    # Runs the Playwright critical-path spec (e2e/signup-add-transaction.spec.ts) against
    # a dedicated TEST Supabase project — same secrets and same skip-if-unconfigured
    # pattern as verify-rls above, since this also creates a real auth user per run.
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.RLS_TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.RLS_TEST_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check E2E test project secrets are configured
        id: secrets-check
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping E2E — RLS_TEST_SUPABASE_* secrets are not set. See RULES.md's testing section."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.secrets-check.outputs.configured == 'true'
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        if: steps.secrets-check.outputs.configured == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets-check.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.secrets-check.outputs.configured == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web
        if: steps.secrets-check.outputs.configured == 'true'
        run: pnpm --filter web build

      - name: Start web and run E2E
        if: steps.secrets-check.outputs.configured == 'true'
        working-directory: apps/web
        run: |
          pnpm start &
          npx wait-on http://localhost:3000
          cd ../..
          pnpm test:e2e
