packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Only downloads the sentry-cli binary for source-map upload — this integration is a
  # minimal manual Sentry.init()/captureException() (see logger.ts), no source-map upload
  # step, so the binary is never invoked. Safe to leave unbuilt.
  '@sentry/cli': false
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  # GHSA-qx2v-qp2m-jg93 (moderate XSS) + GHSA-r28c-9q8g-f849 (high path traversal via
  # sourceMappingURL), both patched same-major — safe transitive bump forced across every
  # nested postcss (mostly pulled in by Expo's Metro tooling, apps/mobile only).
  postcss@<8.5.18: ">=8.5.18"
  # GHSA-28wg-ghj8-5hjv / GHSA-2v37-7h3g-55p8 (high, infinite loop on a zero-size custom
  # generator), patched same-major — same transitive-bump treatment, pulled in by Expo's
  # Metro/router tooling.
  nanoid@<3.3.18: ">=3.3.18"
